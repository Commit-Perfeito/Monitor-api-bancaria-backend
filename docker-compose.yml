services:
  db:
    image: postgres:14
    container_name: monitor-db
    restart: always
    environment:
      POSTGRES_USER: 'docker'
      POSTGRES_PASSWORD: '123456'
      POSTGRES_DB: 'monitor-web'
    ports:
      - '5432:5432'

  redis:
    image: redis:alpine
    container_name: redis
    command: redis-server --requirepass 123456
    ports:
      - '6379:6379'
    restart: always

